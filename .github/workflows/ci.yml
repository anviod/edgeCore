name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - master
  push:
    branches:
      - dev
      - main
      - master

jobs:
  # ---------- Lint 强制门禁（golangci-lint，使用仓库根目录 .golangci.yml）----------
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # --new-from-rev 需要基线 ref 的完整提交历史
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # .golangci.yml 已是 v2 配置格式（version: "2"），v1.x 无法加载；
          # 且 go.mod 要求 go 1.26.4，linter 二进制须由 >= go1.26.4 的 Go 构建，
          # 否则报 "the Go language version used to build golangci-lint is
          # lower than the targeted Go version"（action v8+ 要求 >= v2.1.0）
          version: v2.14.0
          # 存量欠账约 1092 条（其中 926 条在旧规则集下即存在）：以 origin/dev
          # 为基线只报增量，新代码仍受全量规则约束；存量清零后移除
          # --new-from-rev 恢复全量门禁
          args: --build-tags sim --timeout 5m --new-from-rev=origin/dev

  gates:
    name: Short tests and build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Install dependencies
        run: go mod download

      - name: Run short unit tests
        env:
          CGO_ENABLED: '0'
        run: make test-short

      - name: Run short soak gate
        env:
          CGO_ENABLED: '0'
        run: make test-soak-short

      - name: Build smoke (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/main.go

  bench-q3:
    name: Q3 10k benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Install dependencies
        run: go mod download

      - name: Run Q3 benchmark gate
        env:
          CGO_ENABLED: '0'
        run: make bench-q3
