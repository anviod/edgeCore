name: Release Workflow

on:
  push:
    tags:
      - 'v*'  # 推送以 v 开头的 tag 时触发，例如 v0.0.11

permissions:
  contents: write  # 授予创建 Release 的权限

jobs:
  release:
    name: Build & Release via goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          check-latest: true
          cache: false  # 关闭 Go 缓存，避免 GitHub 缓存损坏导致 tar 恢复失败（Cannot open: File exists）

      - name: Set up Node (frontend build hook)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install UI dependencies
        run: npm ci --prefix ui

      # 基于 .goreleaser.yml 构建二进制、归档、deb/rpm 包与校验和，并自动创建 GitHub Release
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.18.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
