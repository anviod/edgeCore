name: Release Workflow

on:
  push:
    tags:
      - 'v*'  # 推送以 v 开头的 tag 时触发，例如 v0.0.11

permissions:
  contents: write  # 授予创建 Release 的权限

jobs:
  release:
    name: Build & Release via goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Node (frontend build hook)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        run: npm ci --prefix ui

      # 基于 .goreleaser.yml 构建二进制、归档、deb/rpm 包与校验和，并自动创建 GitHub Release
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}